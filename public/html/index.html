<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <link rel="stylesheet" href="../css/style.css" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Next Rail</title>

        <script type="module" src="../js/main.js"></script>
    </head>
    <body>
        <header>
            <h1>Next Rail</h1>
            <section id="station_search">
                <input
                    id="search_input"
                    type="text"
                    placeholder="Search station…"
                    autocomplete="off"
                    spellcheck="false"
                />
                <ul id="search_results"></ul>
                <button id="locate">
                    <!-- Marker Icon -->
                    <svg
                        viewBox="0 0 24 24"
                        width="34"
                        height="34"
                        fill="currentColor"
                    >
                        <path
                            d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"
                        />
                    </svg>
                </button>
            </section>
        </header>

        <!-- Current Station -->
        <article id="station" class="info_panel">
            <section class="info_list">
                <p id="stat_name">Portsmouth Harbour</p>
                <p id="stat_code">PMH</p>
            </section>
        </article>

        <section id="app-body">

        <!-- DEPARTURE -->
        <section class="page-panel">
            <!-- Countdown Clock -->
            <section id="depart_countdown" class="info_panel">
                <h2 id="depart_cd_label"></h2>
                <h1 id="depart_cd_timer"></h1>
            </section>

            <!-- Journey Info -->
            <article id="journey_info" class="info_panel">
                <section id="depart_tofrom" class="info_list">
                    <p id="depart_from"></p>
                    <p id="depart_arrow">&rarr;</p>
                    <p id="depart_to"></p>
                </section>
                <section id="depart_div" class="info_list">
                    <p>Departing</p>
                    <p id="depart_time" class="value"></p>
                </section>
                <p id="depart_cancel_reason" hidden></p>
                <section class="info_list">
                    <p>Platform</p>
                    <p id="depart_platform_num" class="value"></p>
                </section>
                <section class="info_list">
                    <p>Stops</p>
                    <p id="depart_stop_num" class="value"></p>
                </section>
                <section class="info_list">
                    <p>Carriages</p>
                    <p id="depart_cars_num" class="value"></p>
                </section>
                <section id="journey" class="info_list">
                    <p>Journey</p>
                    <p id="depart_jt_time" class="value"></p>
                </section>
                <section id="operator" class="info_list">
                    <p>Operator</p>
                    <p id="depart_op_name" class="value"></p>
                </section>
            </article>

            <!-- Upcoming Departures -->
            <article class="info_panel">
                <section id="depart_next_train_label" class="info_list">
                    <p>Upcoming Departures</p>
                </section>
                <section id="next_depart_1" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
                <section id="next_depart_2" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
                <section id="next_depart_3" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
            </article>
        </section>
        
        <!-- ARRIVAL -->
        <section class="page-panel">
            <!-- Countdown Clock -->
            <section id="arrive_countdown" class="info_panel">
                <h2 id="arrive_cd_label"></h2>
                <h1 id="arrive_cd_timer"></h1>
            </section>

            <!-- Journey Info -->
            <article id="arrive_journey_info" class="info_panel">
                <section id="arrive_tofrom" class="info_list">
                    <p id="arrive_from"></p>
                    <p id="arrive_arrow">&rarr;</p>
                    <p id="arrive_to"></p>
                </section>
                <section id="arrive_depart_div" class="info_list">
                    <p>Arriving</p>
                    <p id="arrive_time" class="value"></p>
                </section>
                <p id="arrive_cancel_reason" hidden></p>
                <section class="info_list">
                    <p>Platform</p>
                    <p id="arrive_platform_num" class="value"></p>
                </section>
                <section class="info_list">
                    <p>Stops</p>
                    <p id="arrive_stop_num" class="value"></p>
                </section>
                <section class="info_list">
                    <p>Carriages</p>
                    <p id="arrive_cars_num" class="value"></p>
                </section>
                <section id="arrive_journey" class="info_list">
                    <p>Journey</p>
                    <p id="jt_time" class="value"></p>
                </section>
                <section id="arrive_operator" class="info_list">
                    <p>Operator</p>
                    <p id="arrive_op_name" class="value"></p>
                </section>
            </article>

            <!-- Upcoming Arrivals -->
            <article class="info_panel">
                <section id="arrive_next_train_label" class="info_list">
                    <p>Upcoming Arrivals</p>
                </section>
                <section id="next_arrive_1" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
                <section id="next_arrive_2" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
                <section id="next_arrive_3" class="info_list">
                    <p></p>
                    <p class="value"></p>
                </section>
            </article>
        </section>
    </section>
    </body>
</html>
